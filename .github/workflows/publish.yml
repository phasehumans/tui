name: Publish CLI to npm

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: 'npm release tag (e.g. latest, beta)'
                required: true
                default: 'latest'

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build monorepo
              run: bun run build

            - name: Publish @trydecember/tui to npm
              working-directory: apps/cli
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish --tag ${{ github.event.inputs.tag || 'latest' }} --access public
